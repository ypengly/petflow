[package]
name = "petflow"
version = "1.0.0"
description = "PetFlow - A Little Friend While You Work"
authors = ["Y Pengly"]
edition = "2021"

[lib]
name = "petflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
